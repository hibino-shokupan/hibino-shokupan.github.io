<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご予約の管理｜&amp;.&amp;～日々の食パン～</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@300;400;500&family=Noto+Serif+JP:wght@200;300;400&display=swap">
<link rel="stylesheet" href="../style.css?v=20260922a">
<link rel="stylesheet" href="kanri.css?v=20260922a">
</head>
<body class="kanri">

<header class="head">
  <h1>ご予約の管理</h1>
  <p class="head-note">キャンセルのお電話を受けたら、その方の「キャンセル」を押してください。</p>
</header>

<main id="main">
  <!-- 鍵が端末に無いとき。鍵は端末ごとに保存されるので、PCで開けても電話では出る -->
  <section id="unlock" class="unlock" hidden>
    <p class="unlock-lead">このページを開くには<br>お店専用の<b>鍵</b>が必要です。</p>
    <p class="unlock-note">届いているURL、または鍵の文字をそのまま貼り付けてください。</p>
    <input id="unlock-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="ここに貼り付け">
    <button type="button" id="unlock-go" class="btn btn-main">開く</button>
    <p id="unlock-error" class="unlock-error" hidden></p>
  </section>

  <div id="board" class="board" hidden>
  <div class="bar">
    <span id="updated" class="updated"></span>
    <button type="button" id="reload" class="btn btn-sub btn-small">最新にする</button>
  </div>

  <!-- 1日ずつめくる -->
  <nav class="daynav">
    <button type="button" id="prev-day" class="nav-btn" aria-label="前の日">‹</button>
    <div class="daynav-body">
      <b id="day-rel" class="day-rel" hidden></b>
      <span id="day-label" class="day-label">読み込み中</span>
    </div>
    <button type="button" id="next-day" class="nav-btn" aria-label="次の日">›</button>
  </nav>
  <p id="day-sum" class="day-sum"></p>

  <p id="notice" class="notice-msg" hidden></p>
  <p id="error" class="error" hidden></p>

  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden></p>
  </div><!-- /board -->
</main>

<footer class="foot">
  <p class="foot-name">&amp;.&amp;～日々の食パン～</p>
  <p>このページはお店専用です。<br>お客様には見えません。</p>
</footer>

<script src="app.js?v=20260922a"></script>
</body>
</html>
