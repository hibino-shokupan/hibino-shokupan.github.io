<!doctype html><meta charset="utf-8"><title>keyout</title>
<body style="font:14px sans-serif;padding:20px;background:#888">
<div id="log">working...</div>
<canvas id="c" style="max-width:360px;background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/20px 20px"></canvas>
<script>
const p=new URLSearchParams(location.search);
const im=new Image();
im.onload=()=>{
  const c=document.getElementById('c');
  c.width=im.naturalWidth; c.height=im.naturalHeight;
  const x=c.getContext('2d');
  x.drawImage(im,0,0);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data;
  for(let i=0;i<a.length;i+=4){
    const lum=0.299*a[i]+0.587*a[i+1]+0.114*a[i+2];
    a[i+3]=Math.max(0,Math.min(255,Math.round(255-lum*1.08)));
    a[i]=42; a[i+1]=37; a[i+2]=34;
  }
  x.putImageData(d,0,0);
  c.toBlob(async b=>{
    const r=await fetch('/save?name='+encodeURIComponent(p.get('n')||'out.png'),{method:'POST',body:b});
    document.getElementById('log').textContent=`DONE ${c.width}x${c.height} ${(b.size/1024).toFixed(0)}KB — server: ${await r.text()}`;
  },'image/png');
};
im.onerror=()=>document.getElementById('log').textContent='ERROR';
im.src=p.get('f');
</script>
